<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI·로봇 연구 논문 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">🤖</span>
      <div>
        <h1>AI·로봇 연구 논문</h1>
        <p class="sub">Hugging Face Papers · 매일 오전 9시 자동 수집 · <span id="updatedAt">-</span></p>
      </div>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="제목·키워드 검색" aria-label="논문 검색" />
      <select id="sort" aria-label="정렬">
        <option value="date">최신순</option>
        <option value="citations">인용순</option>
        <option value="upvotes">추천순</option>
      </select>
      <label class="rate">TTS 속도
        <select id="rate" aria-label="TTS 속도">
          <option value="0.7">느리게</option>
          <option value="0.9" selected>보통</option>
          <option value="1.1">빠르게</option>
        </select>
      </label>
    </div>
  </header>

  <nav id="chips" class="chips" aria-label="주제 필터"></nav>

  <main class="layout">
    <aside class="list" aria-label="논문 목록">
      <p class="count" id="count"></p>
      <ul id="paperList"></ul>
    </aside>

    <section class="detail" id="detail" aria-live="polite">
      <div class="empty">왼쪽에서 논문을 선택하세요.</div>
    </section>

    <aside class="chat" id="chat" aria-label="논문 채팅">
      <div class="chat-head">
        <strong>💬 논문과 대화하기</strong>
        <button class="icon-btn mobile-only" id="chatClose" aria-label="채팅 닫기">✕</button>
      </div>
      <div class="chat-suggest" id="chatSuggest"></div>
      <div class="chat-log" id="chatLog"></div>
      <form class="chat-form" id="chatForm">
        <textarea id="chatInput" rows="2" placeholder="이 논문에 대해 질문하세요 (Enter 전송)"></textarea>
        <button type="submit" id="chatSend">전송</button>
      </form>
    </aside>
  </main>

  <button class="chat-fab mobile-only" id="chatOpen" aria-label="채팅 열기">💬</button>

  <script src="app.js" type="module"></script>
</body>
</html>
